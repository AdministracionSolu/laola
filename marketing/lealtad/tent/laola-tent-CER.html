<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Jost:wght@300;400;500&display=swap');
  @page { size: 100mm 150mm; margin: 0; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100mm}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card{position:relative;width:100mm;height:150mm;background:#FAF6EE;overflow:hidden;
    page-break-after:always;font-family:'Jost',sans-serif;color:#155E82}
  .card:last-child{page-break-after:auto}
  .frame{position:absolute;inset:6mm;border:0.4mm solid #155E82;opacity:.4;z-index:1}
  .logo{position:absolute;top:12mm;left:50%;transform:translateX(-50%);z-index:2;
    height:23mm;width:auto;mix-blend-mode:normal}
  .rule{position:absolute;top:39mm;left:50%;transform:translateX(-50%);z-index:2;
    display:flex;align-items:center;justify-content:center;width:24mm}
  .rule::before,.rule::after{content:"";height:0.5mm;flex:1;background:#E98F23}
  .rule i{width:1.8mm;height:1.8mm;margin:0 2mm;background:#E98F23;transform:rotate(45deg)}
  h1{position:absolute;top:45mm;left:8mm;right:8mm;text-align:center;z-index:2;
    font-family:'Playfair Display',serif;font-weight:900;font-size:21pt;
    letter-spacing:.08em;color:#1B87BC}
  .sub{position:absolute;top:59mm;left:9mm;right:9mm;text-align:center;z-index:2;
    font-weight:400;font-size:7.5pt;letter-spacing:.22em;color:#155E82;opacity:.7}
  .suc{position:absolute;top:69mm;left:8mm;right:8mm;text-align:center;z-index:2;
    font-weight:400;font-size:9.5pt;letter-spacing:.28em;color:#155E82}

  .qrbox{position:absolute;right:12mm;bottom:23mm;z-index:2;text-align:center}
  .qlabel{display:block;font-weight:400;font-size:6.5pt;letter-spacing:.3em;margin:0 0 2.5mm .3em;color:#155E82;opacity:.75}
  .qr{width:31mm;height:31mm;background:#FAF6EE;padding:2mm;border:0.3mm solid #155E8266}

  /* Nudge de conversión (cara miembros) */
  .nudge{position:absolute;left:12mm;bottom:26mm;width:41mm;z-index:2;text-align:left}
  .nudge .hook{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;
    font-size:13pt;line-height:1.12;color:#155E82}
  .nudge .cue{font-weight:500;font-size:8pt;letter-spacing:.16em;color:#155E82;margin-top:4mm}
  .nudge .cue b{color:#E98F23;font-weight:700}

  /* Micro-nota útil (cara factura) */
  .foot{position:absolute;left:12mm;bottom:31mm;width:34mm;z-index:2;text-align:left;
    font-weight:400;font-size:6.5pt;letter-spacing:.24em;line-height:1.7;color:#155E82;opacity:.55}

  /* QR secundario de MENÚ (cara utilidades): presente, sin robar protagonismo */
  .menuqr{position:absolute;left:12mm;bottom:24mm;z-index:2;text-align:center}
  .menuqr .qlabel{display:block;font-weight:400;font-size:6.5pt;letter-spacing:.3em;margin:0 0 2.5mm .3em;color:#155E82;opacity:.75}
  .qr2{width:27mm;height:27mm;background:#FAF6EE;padding:1.8mm;border:0.3mm solid #155E8266}
  .diaonly{position:absolute;left:8mm;right:8mm;bottom:13mm;z-index:2;text-align:center;
    font-weight:400;font-size:6pt;letter-spacing:.26em;color:#155E82;opacity:.55}</style></head>
